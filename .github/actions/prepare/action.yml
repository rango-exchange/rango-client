name: Setup Environments
description: 'Setting up Git, NodeJS and authenticate.'

runs:
  using: 'composite'
  steps:
    - name: Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      shell: 'bash'

    # Do not enable setup-node dependency caching for this step.
    # Caching will be handled by the cache step below.
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
        
    - name: Hash workspace keys
      id: workspace-keys
      run: |
        WORKSPACE_KEYS_HASH="$(node ./scripts/workspace-keys-hash/command.mjs)"
        echo "hash=$WORKSPACE_KEYS_HASH" >> "$GITHUB_OUTPUT"
      shell: 'bash'

    # patches/ is part of the key because patch-package only runs on install;
    # a cache hit would otherwise keep node_modules patched with stale patches.
    # There is no restore-keys fallback on purpose: yarn v1 doesn't prune
    # stale nested packages when installing over an older node_modules, so a
    # dependency or patch change must install into an empty tree.
    - name: Cache dependencies
      uses: actions/cache@v6
      id: cache
      with:
        path: '**/node_modules'
        key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock', 'patches/**') }}-${{ steps.workspace-keys.outputs.hash }}

    - name: Install packages
      if: steps.cache.outputs.cache-hit != 'true'
      run: yarn install --frozen-lockfile
      shell: 'bash'
    - name: Call prepare on cache hit
      if: steps.cache.outputs.cache-hit != 'false'
      run: yarn prepare
      shell: 'bash'
